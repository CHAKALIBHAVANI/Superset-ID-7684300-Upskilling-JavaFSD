<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Page title -->
    <title>Local Community Event Portal</title>

    <!-- CSS file connection -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Main page container -->
    <div class="container">

        <!-- Main heading -->
        <h1>
            Community Event Portal
        </h1>

        <!-- Event card section -->
        <div class="eventCard">

            <h2>
                Health Awareness Program
            </h2>

            <p>
                Local residents can join free health
                and wellness activities this weekend.
            </p>

        </div>

        <!-- Form section -->
        <form>

            <!-- Input field -->
            <input type="text"
                   placeholder="Enter Your Name">

        </form>

        <!-- Visibility hidden example -->
        <div class="hiddenBox">
            Visibility Hidden Box
        </div>

        <!-- Display none example -->
        <div class="noneBox">
            Display None Box
        </div>

    </div>

</body>
</html>
