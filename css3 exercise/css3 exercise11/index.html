<!DOCTYPE html>
<html lang="en">
<head>

    <!-- Basic page setup -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>DevTools Test Page</title>

    <!-- External CSS file for Network tab checking -->
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Main portal section -->
    <div class="portal-box">

        <!-- Heading to inspect in DevTools -->
        <h1>Local Community Event Portal</h1>

        <!-- Card used to test layout on small screens -->
        <div class="event-card">
            <h2>Screen Size Testing</h2>
            <p class="info-text">
    Resize the browser window to test responsive layout changes.
        </p>
        <!-- Instruction message for evaluator -->
<p class="instruction">
    For mobile responsive testing, press Ctrl + Shift + I 
    and then Ctrl + Shift + M to view tablet and phone layouts.
</p>
        </div>

    </div>

</body>
</html>
